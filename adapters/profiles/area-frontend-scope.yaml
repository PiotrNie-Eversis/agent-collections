# Area profile: frontend-scope (isolation-strategy §5 / DHI-530)
# Abstract layout only — apps/web, apps/api (no client names).
id: frontend-scope
include:
  - apps/web/**
  - packages/ui/**
  - packages/shared-types/**
  - docs/**
  - scripts/**
exclude:
  - apps/api/**
  - charts/**
  - "**/node_modules/**"
