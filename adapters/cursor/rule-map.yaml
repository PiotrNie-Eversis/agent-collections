# Cursor adapter rule map (TASK-524)
# Packaging metadata lives here — not in .ai/rules/*.md
version: 1
rules:
  - id: eversis-agent-core
    source: .ai/rules/orchestration/agent-core.md
    output: .cursor/rules/eversis-agent-core.mdc
    description: "Core agent behavior — relay workflow, human gates, no placeholder code"
    alwaysApply: true
  - id: eversis-testing-and-terminal
    source: .ai/rules/orchestration/testing-and-terminal.md
    output: .cursor/rules/eversis-testing-and-terminal.mdc
    description: "Run project quality commands after substantive edits"
    alwaysApply: true
  - id: eversis-accessibility
    source: .ai/rules/frontend/accessibility.md
    output: .cursor/rules/eversis-accessibility.mdc
    description: "Accessibility expectations for UI code"
    globs:
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
      - "**/*.html"
      - "**/*.svelte"
  - id: eversis-engineering-manager
    source: .ai/rules/orchestration/engineering-manager.md
    output: .cursor/rules/eversis-engineering-manager.mdc
    description: "Engineering Manager — orchestrate research, plan, implementation (use with eversis-implement)"
    globs: []
    alwaysApply: false
  - id: eversis-code-reviewer
    source: .ai/rules/architecture/code-reviewer.md
    output: .cursor/rules/eversis-code-reviewer.mdc
    description: "Code review — structure PASS / BLOCKER / SUGGESTION (use with eversis-review)"
    globs: []
    alwaysApply: false
  - id: eversis-fine-handoff
    source: .ai/rules/orchestration/fine-handoff.md
    output: .cursor/rules/eversis-fine-handoff.mdc
    description: "Fine handoff — QA comment draft after Implement (eversis-fine-handoff)"
    globs: []
    alwaysApply: false
  - id: eversis-spec-driven-development
    source: .ai/rules/orchestration/spec-driven-development.md
    output: .cursor/rules/eversis-spec-driven-development.mdc
    description: "Spec-driven development — Delivery Standard (research → plan → implement → review → Fine)"
    globs: []
    alwaysApply: false
