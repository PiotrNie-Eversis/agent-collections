    - generic [ref=f3e231]:
      - generic [ref=f3e232]:
        - heading "Core use cases" [level=2] [ref=f3e233]
        - paragraph [ref=f3e234]: Every use case has dedicated agents, prompts, and workflows — not generic AI assistance.
      - generic [ref=f3e235]:
        - generic [ref=f3e236]:
          - generic [ref=f3e237]: Ideate
          - generic [ref=f3e238]: Workshop Outputs to Jira Backlog
          - generic [ref=f3e239]: Discovery workshops produce valuable transcripts, Figma boards, and shared notes — but converting them into structured, actionable Jira tickets is a manual, error-prone process. Tasks are vague, edge cases are missed, and the backlog doesn’t reflect what was actually discussed.
          - generic [ref=f3e240]: "[~15 min vs 1–2 days]"
        - generic [ref=f3e242]:
          - generic [ref=f3e243]: Implement
          - generic [ref=f3e244]: Single-Session Context Gathering
          - generic [ref=f3e245]: Requirements live in Jira, designs in Figma, documentation in Confluence, code in GitHub. Developers constantly context-switch to gather information. MCP integrations bring all context into a single Cursor session.
          - generic [ref=f3e246]: "[~3 min vs 30–60 min]"
        - generic [ref=f3e248]:
          - generic [ref=f3e249]: Review
          - generic [ref=f3e250]: Automated Code Review
          - generic [ref=f3e251]: Multi-dimensional review checking acceptance criteria, security, performance, database patterns, and coding standards. Clear PASS/BLOCKER/SUGGESTION verdicts on every run.
          - generic [ref=f3e252]: "[~5 min]"
        - generic [ref=f3e254]:
          - generic [ref=f3e255]: Implement
          - generic [ref=f3e256]: Pixel-Perfect UI Delivery
          - generic [ref=f3e257]: Frontend implementations deviate from Figma — wrong spacing, colours, component variants. QA catches these late, causing rework. The automated Figma verification loop runs up to 5 iterations, comparing the running app via Playwright against Figma specs before the code ever reaches human review.
          - generic [ref=f3e258]: "[95–99% design accuracy]"
        - generic [ref=f3e260]:
          - generic [ref=f3e261]: Review
          - generic [ref=f3e262]: Security Built Into Every Plan and Review
          - generic [ref=f3e263]: Security reviews happen at the end of a sprint — if at all. DRY, KISS, and proper error handling are inconsistently applied. Every plan includes security considerations by default. The Code Reviewer agent checks for vulnerabilities, missing input validation, and exposed secrets on every run.
          - generic [ref=f3e264]: "[Built in, every time]"
        - generic [ref=f3e266]:
          - generic [ref=f3e267]: Implement
          - generic [ref=f3e268]: Onboarding New Team Members
          - generic [ref=f3e269]: New developers spend days understanding the codebase, conventions, and task requirements before they can contribute. The eversis-implement prompt triggers the Engineering Manager, which automatically delegates to the Context Engineer to gather context from Jira, Confluence, Figma, and the codebase. It then delegates to the Architect to create a step-by-step implementation path — within minutes, not days.
          - generic [ref=f3e270]: "[~5 min per task]"
        - generic [ref=f3e272]:
          - generic [ref=f3e273]: Implement
          - generic [ref=f3e274]: Architecture Plan from a Ticket
          - generic [ref=f3e275]: Generates a phased implementation plan with CREATE/MODIFY/REUSE labels, security considerations, and clear definitions of done — directly from a Jira ticket.
          - generic [ref=f3e276]: "[~5 min]"
        - generic [ref=f3e278]:
          - generic [ref=f3e279]: Review
          - generic [ref=f3e280]: Reliable E2E Test Suites
          - generic [ref=f3e281]: E2E tests are written inconsistently, use brittle selectors, and break on unrelated changes. Teams stop trusting them and start skipping them. The E2E Engineer agent enforces Page Object patterns, accessibility-first locators, and verifies tests for 3+ consecutive passes before commit.
          - generic [ref=f3e282]: "[~10 min per test suite]"
        - generic [ref=f3e284]:
          - generic [ref=f3e285]: Implement
          - generic [ref=f3e286]: Cloud Cost Optimization
          - generic [ref=f3e287]: Cloud bills keep growing but nobody knows which resources are wasteful. The DevOps Engineer agent performs hybrid audits — analyzing IaC code and validating against live infrastructure via AWS/GCP APIs to identify savings opportunities.
          - generic [ref=f3e288]: "[~10 min per audit]"
        - generic [ref=f3e290]:
          - generic [ref=f3e291]: Implement
          - generic [ref=f3e292]: Business Knowledge That Survives the Task
          - generic [ref=f3e293]: Confirmed business rules and codebase conventions get re-explained every session, or buried in a one-off task where nobody else finds them. At Fine, durable facts are captured once into a plain-Markdown domain context store — readable by the next session, in this project or any other repo in the group, instead of rediscovering them from scratch.
          - generic [ref=f3e294]: "[No re-explaining, ever]"
